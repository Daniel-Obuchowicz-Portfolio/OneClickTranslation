services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      OCT_DEBUG: ${OCT_DEBUG:-false}
      WORDPRESS_CONFIG_EXTRA: |
        defined('OCT_DEEPL_API_KEY') || define('OCT_DEEPL_API_KEY', getenv('DEEPL_API_KEY') ?: '');
        defined('OCT_DEBUG') || define('OCT_DEBUG', filter_var(getenv('OCT_DEBUG') ?: 'false', FILTER_VALIDATE_BOOLEAN));
        defined('WP_DEBUG') || define('WP_DEBUG', true);
        defined('WP_DEBUG_LOG') || define('WP_DEBUG_LOG', true);
        defined('WP_DEBUG_DISPLAY') || define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wordpress_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/oneclicktranslation
      - ./docker/wordpress/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      OCT_DEBUG: ${OCT_DEBUG:-false}
    volumes:
      - wordpress_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/oneclicktranslation
    working_dir: /var/www/html
    entrypoint: ["wp", "--allow-root"]

  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database

volumes:
  db_data:
  wordpress_data:
